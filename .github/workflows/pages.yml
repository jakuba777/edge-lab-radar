# No pull_request triggers, no secrets; pin dependencies to reviewed commits.
name: Aktualizacja danych i publikacja EDGE LAB
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 1,7,13,19 * * *'
concurrency:
  group: edge-lab-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pobierz i sprawdź dane
        run: python scripts/build_data.py
      - name: Testy danych i bezpieczeństwa
        run: python -m unittest discover -s tests -v
      - name: Historyczny audyt Poissona (bez przyszłych wyników)
        run: python scripts/backtest.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
