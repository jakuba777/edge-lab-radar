name: EDGE LAB — awaryjna publikacja strony
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages-static.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edge-lab-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Sprawdź pliki aplikacji
        run: |
          test -f site/index.html
          test -f site/moje-zaklady.html
          test -f site/assets/real-bets.js
          test -f site/assets/real-bets.css
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
