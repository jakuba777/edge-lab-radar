name: EDGE LAB VALUE — tests
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'src/value-engine-v2.js'
      - 'tests/value-engine-v2.test.cjs'
      - 'value-lab.html'
      - 'tests/value-lab-html.test.cjs'
      - 'src/dual-engine.js'
      - 'tests/dual-engine.test.cjs'
      - 'dual-lab.html'
      - 'tests/dual-lab-html.test.cjs'
      - 'src/backtest-audit.js'
      - 'tests/backtest-audit.test.cjs'
      - 'src/prediction-ledger.js'
      - 'tests/prediction-ledger.test.cjs'
      - 'src/multi-market.js'
      - 'tests/multi-market.test.cjs'
      - 'multi-market-lab.html'
      - 'tests/multi-market-html.test.cjs'
      - 'src/quote-snapshots.js'
      - 'tests/quote-snapshots.test.cjs'
      - 'src/market-labels.js'
      - 'tests/market-labels.test.cjs'
      - 'site/analiza.html'
      - 'site/assets/analiza.js'
      - 'site/assets/analiza.css'
      - 'site/assets/edge-feature.css'
      - 'site/assets/editorial.css'
      - 'site/assets/coupon-core.js'
      - 'site/assets/price-lab.js'
      - 'site/assets/kupony.js'
      - 'site/assets/kupony.css'
      - 'tests/price-lab.test.cjs'
      - 'site/assets/app.js'
      - 'site/kupony.html'
      - 'site/skutecznosc.html'
      - 'tests/editorial-ui.test.cjs'
      - 'site/index.html'
      - 'tests/mobile-analysis.test.cjs'
      - '.github/workflows/value-engine-tests.yml'
  workflow_dispatch:
jobs:
  value-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Value engine unit tests
        run: |
          node tests/value-engine-v2.test.cjs
          node tests/value-lab-html.test.cjs
          node tests/dual-engine.test.cjs
          node tests/dual-lab-html.test.cjs
          node tests/backtest-audit.test.cjs
          node tests/prediction-ledger.test.cjs
          node tests/multi-market.test.cjs
          node tests/multi-market-html.test.cjs
          node tests/quote-snapshots.test.cjs
          node tests/market-labels.test.cjs
          node tests/mobile-analysis.test.cjs
          node tests/editorial-ui.test.cjs
          node tests/price-lab.test.cjs
