name: EDGE LAB VALUE — tests
on:
  pull_request:
    paths:
      - 'src/value-engine-v2.js'
      - 'tests/value-engine-v2.test.cjs'
      - '.github/workflows/value-engine-tests.yml'
  workflow_dispatch:
jobs:
  value-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Value engine unit tests
        run: node tests/value-engine-v2.test.cjs
